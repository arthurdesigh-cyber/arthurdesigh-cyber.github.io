<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadence — connecting TikTok…</title>
<meta name="robots" content="noindex">

<h1>Connecting TikTok…</h1>
<p>Returning you to Cadence. If nothing happens, make sure Cadence is running on this computer.</p>
<script>
  // TikTok requires an HTTPS redirect URI. This page hands the authorization result
  // (?code=…&state=… or ?error=…) to the Cadence server running on this computer.
  var CADENCE = 'http://localhost:3000';
  location.replace(CADENCE + '/oauth/tiktok/callback' + location.search);
</script>
</body></html>
